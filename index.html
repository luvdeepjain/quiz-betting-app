<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Betting App - MVP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">🎯 Quiz Betting <span class="badge bg-warning text-dark">Demo Mode</span></a>
            <div class="navbar-nav ms-auto" id="navbar-items">
                <span class="navbar-text me-3" id="user-info" style="display: none;">
                    Welcome, <span id="username"></span> | Balance: ₹<span id="wallet-balance">0</span>
                </span>
                <button class="btn btn-outline-light" id="logout-btn" style="display: none;" onclick="logout()">
                    Logout
                </button>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <!-- Login/Register Forms -->
        <div id="auth-section" class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body">
                        <ul class="nav nav-tabs" id="auth-tabs">
                            <li class="nav-item">
                                <a class="nav-link active" id="login-tab" data-bs-toggle="tab" href="#login-form">Login</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" id="register-tab" data-bs-toggle="tab" href="#register-form">Register</a>
                            </li>
                        </ul>
                        <div class="tab-content mt-3" id="auth-content">
                            <!-- Login Form -->
                            <div class="tab-pane fade show active" id="login-form">
                                <form id="login-form-element">
                                    <div class="mb-3">
                                        <label for="login-email" class="form-label">Email</label>
                                        <input type="email" class="form-control" id="login-email" required>
                                    </div>
                                    <div class="mb-3">
                                        <label for="login-password" class="form-label">Password</label>
                                        <input type="password" class="form-control" id="login-password" required>
                                    </div>
                                    <button type="submit" class="btn btn-primary w-100">Login</button>
                                </form>
                            </div>
                            <!-- Register Form -->
                            <div class="tab-pane fade" id="register-form">
                                <form id="register-form-element">
                                    <div class="mb-3">
                                        <label for="register-username" class="form-label">Username</label>
                                        <input type="text" class="form-control" id="register-username" required>
                                    </div>
                                    <div class="mb-3">
                                        <label for="register-email" class="form-label">Email</label>
                                        <input type="email" class="form-control" id="register-email" required>
                                    </div>
                                    <div class="mb-3">
                                        <label for="register-password" class="form-label">Password</label>
                                        <input type="password" class="form-control" id="register-password" required minlength="6">
                                    </div>
                                    <button type="submit" class="btn btn-success w-100">Register</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Main App Section -->
        <div id="app-section" style="display: none;">
            <!-- Game Area -->
            <div class="row">
                <div class="col-md-8">
                    <div class="card mb-4">
                        <div class="card-header d-flex justify-content-between align-items-center">
                            <h5>Quiz Question</h5>
                            <button class="btn btn-sm btn-primary" onclick="loadNewQuestion()">New Question</button>
                        </div>
                        <div class="card-body" id="question-area">
                            <p class="text-center text-muted">Click "New Question" to start playing!</p>
                        </div>
                    </div>
                </div>
                
                <!-- Sidebar -->
                <div class="col-md-4">
                    <div class="card mb-3">
                        <div class="card-header">
                            <h6>Categories</h6>
                        </div>
                        <div class="card-body" id="categories-list">
                            <div class="text-center text-muted">Loading categories...</div>
                        </div>
                    </div>
                    
                    <div class="card">
                        <div class="card-header">
                            <h6>Recent Bets</h6>
                        </div>
                        <div class="card-body" id="recent-bets">
                            <div class="text-center text-muted">No bets yet</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Alert Area -->
        <div id="alert-area" class="mt-3"></div>
    </div>

    <!-- Bet Modal -->
    <div class="modal fade" id="betModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Place Your Bet</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label for="bet-amount" class="form-label">Bet Amount (₹)</label>
                        <input type="number" class="form-control" id="bet-amount" min="1" step="1" placeholder="Enter bet amount">
                    </div>
                    <div class="alert alert-info">
                        <small>Win 2x your bet amount for correct answers!</small>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-success" id="confirm-bet-btn">Confirm Bet</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
